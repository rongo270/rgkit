org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Published coordinate. artifactId comes from each Gradle project name
# (see settings.gradle.kts), e.g. io.github.rongo270:exit-reason:0.2.0
GROUP=io.github.rongo270
VERSION_NAME=0.2.0

POM_URL=https://github.com/rongo270/rgkit
POM_SCM_URL=https://github.com/rongo270/rgkit
POM_SCM_CONNECTION=scm:git:https://github.com/rongo270/rgkit.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rongo270/rgkit.git

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt

POM_DEVELOPER_ID=rongo270
POM_DEVELOPER_NAME=Rongo
POM_DEVELOPER_URL=https://github.com/rongo270

# Signing keys are NOT stored here — this file is committed to git.
# Put signingInMemoryKey / signingInMemoryKeyPassword in
# ~/.gradle/gradle.properties instead. See PUBLISHING.md.
