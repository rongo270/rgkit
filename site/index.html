<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="13 local-first mobile SDKs that infer intent, context, friction and rhythm entirely on-device. No backend, no API key, no account.">
<title>rgkit</title>

<style>
/* ============================================================
   TOKENS — light is the base; dark redefined in both scopes
   ============================================================ */
:root {
  color-scheme: light;

  --bg:            #eef2f3;
  --panel:         #f8fafa;
  --panel-2:       #ffffff;
  --rule:          #cdd8da;
  --rule-soft:     #dee6e7;

  --ink:           #0b1416;
  --ink-2:         #3d5157;
  --ink-3:         #6b8288;

  --accent:        #00727d;
  --accent-soft:   #d3e9ec;
  --accent-line:   #9dcbd1;

  --series-1:      #008e9b;
  --series-2:      #bf5f08;
  --good:          #16794f;
  --warn:          #b3690a;
  --crit:          #b3352a;

  --grid:          #e2eaeb;

  --shadow:        0 1px 2px rgba(11,20,22,.06), 0 8px 24px -12px rgba(11,20,22,.18);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* the display face; overridden for Hebrew, which mono stacks don't cover */
  --display: var(--mono);
  --display-track: -.045em;

  --maxw: 1120px;
  --step--1: clamp(.75rem, .72rem + .12vw, .82rem);
  --step-0:  clamp(.95rem, .92rem + .16vw, 1.04rem);
  --step-1:  clamp(1.15rem, 1.08rem + .34vw, 1.4rem);
  --step-2:  clamp(1.5rem, 1.34rem + .78vw, 2.1rem);
  --step-3:  clamp(2.1rem, 1.7rem + 1.95vw, 3.6rem);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:          #090f11;
    --panel:       #101a1d;
    --panel-2:     #162225;
    --rule:        #24363a;
    --rule-soft:   #1a292c;
    --ink:         #e2ecee;
    --ink-2:       #9fb4b9;
    --ink-3:       #6d868c;
    --accent:      #3ac7d4;
    --accent-soft: #10333a;
    --accent-line: #1e5d67;
    --series-1:    #12939f;
    --series-2:    #c8841f;
    --good:        #35a06f;
    --warn:        #d29433;
    --crit:        #e0685a;
    --grid:        #1b2b2e;
    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:          #090f11;
  --panel:       #101a1d;
  --panel-2:     #162225;
  --rule:        #24363a;
  --rule-soft:   #1a292c;
  --ink:         #e2ecee;
  --ink-2:       #9fb4b9;
  --ink-3:       #6d868c;
  --accent:      #3ac7d4;
  --accent-soft: #10333a;
  --accent-line: #1e5d67;
  --series-1:    #12939f;
  --series-2:    #c8841f;
  --good:        #35a06f;
  --warn:        #d29433;
  --crit:        #e0685a;
  --grid:        #1b2b2e;
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
}

/* Hebrew: mono stacks carry no Hebrew glyphs, so the display face swaps
   to a Hebrew-capable sans. Latin identifiers keep the mono face. */
:root[lang="he"] {
  --sans: "Heebo", "Assistant", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
  --display: var(--sans);
  --display-track: -.02em;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

code, pre, .mono { font-family: var(--mono); font-variant-ligatures: none; }

/* Latin identifiers stay LTR even inside RTL prose */
.ltr, pre.code, .install-body code, .kv dd, table.data,
.keyrow .kval, .tile .num, .chart-wrap, .row .nm, .chip, .scope-head .r,
.ro .k, .ro .v { unicode-bidi: plaintext; }
pre.code, .install-body code, .chart-wrap, table.data { direction: ltr; }

.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); }

.eyebrow {
  font-family: var(--mono); font-size: var(--step--1);
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
}
:root[lang="he"] .eyebrow { font-family: var(--sans); letter-spacing: .08em; }

.lede { color: var(--ink-2); max-width: 62ch; }

.tickrule {
  height: 13px; border-top: 1px solid var(--rule);
  background-image: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px 44px);
  background-size: 44px 6px; background-repeat: repeat-x; opacity: .85;
}

/* ============================================================
   NAV
   ============================================================ */
header.nav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-in { display: flex; align-items: center; gap: 1.5rem; height: 58px; }

.brand { display: flex; align-items: baseline; gap: .55rem; margin-inline-end: auto; }
.brand b { font-family: var(--mono); font-size: 1.06rem; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
.brand span { font-family: var(--mono); font-size: .68rem; color: var(--ink-3); letter-spacing: .1em; }

.navlinks { display: flex; gap: .3rem; align-items: center; }
.navlinks a {
  font-family: var(--mono); font-size: .8rem; letter-spacing: .04em;
  color: var(--ink-2); padding: .42rem .6rem; border-radius: 3px;
}
:root[lang="he"] .navlinks a { font-family: var(--sans); letter-spacing: 0; font-size: .86rem; }
.navlinks a:hover { color: var(--ink); background: var(--panel); text-decoration: none; }
.navlinks a.on { color: var(--accent); background: var(--accent-soft); }

.ghost {
  font-family: var(--mono); font-size: .78rem;
  border: 1px solid var(--rule); color: var(--ink-2);
  padding: .38rem .68rem; border-radius: 3px; background: transparent; cursor: pointer;
}
.ghost:hover { border-color: var(--accent-line); color: var(--ink); }
.langbtn { min-width: 62px; }

@media (max-width: 760px) {
  .navlinks a { padding: .35rem .4rem; font-size: .74rem; }
  .brand span, .ghost.gh { display: none; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero { padding: clamp(3rem, 8vw, 6rem) 0 clamp(2rem, 5vw, 3.5rem); }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }

h1.thesis {
  font-family: var(--display); font-size: var(--step-3); line-height: 1.06;
  letter-spacing: var(--display-track); font-weight: 600; margin: .9rem 0 1.1rem;
}
h1.thesis em { font-style: normal; color: var(--accent); }

.hero-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.6rem; }
.btn {
  font-family: var(--mono); font-size: .82rem; letter-spacing: .02em;
  padding: .6rem 1rem; border-radius: 3px; cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: .5rem;
}
:root[lang="he"] .btn { font-family: var(--sans); font-size: .88rem; letter-spacing: 0; }
.btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; }
.btn-primary:hover { text-decoration: none; filter: brightness(1.08); }
.btn-quiet { border-color: var(--rule); color: var(--ink-2); background: transparent; }
.btn-quiet:hover { border-color: var(--accent-line); color: var(--ink); text-decoration: none; }

.install-strip { margin-top: 1.6rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); overflow: hidden; }
.install-tabs { display: flex; border-bottom: 1px solid var(--rule-soft); }
.install-tabs button {
  font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  color: var(--ink-3); padding: .55rem .85rem; cursor: pointer;
}
.install-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.install-body { display: flex; align-items: center; gap: .75rem; padding: .7rem .85rem; }
.install-body code { font-size: .8rem; color: var(--ink); overflow-x: auto; white-space: nowrap; flex: 1; }
.copy {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--rule); color: var(--ink-3);
  padding: .25rem .5rem; border-radius: 3px; cursor: pointer; flex-shrink: 0;
}
.copy:hover { color: var(--accent); border-color: var(--accent-line); }

.scope { border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
.scope-head { display: flex; align-items: center; gap: .55rem; padding: .6rem .85rem; border-bottom: 1px solid var(--rule-soft); background: var(--panel-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.dot.live { animation: pulse 1.9s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.scope-head .t { font-family: var(--mono); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.scope-head .r { margin-inline-start: auto; font-family: var(--mono); font-size: .68rem; color: var(--ink-3); }

#trace { display: block; width: 100%; height: 92px; background: transparent; }

.readouts { border-top: 1px solid var(--rule-soft); }
.ro { display: grid; grid-template-columns: 1fr auto; gap: .3rem .8rem; padding: .5rem .85rem; border-bottom: 1px solid var(--rule-soft); transition: background .35s ease; }
.ro:last-child { border-bottom: 0; }
.ro.hit { background: var(--accent-soft); }
.ro .k { font-family: var(--mono); font-size: .76rem; letter-spacing: .03em; color: var(--ink-2); }
.ro .k.word { font-family: var(--sans); letter-spacing: 0; }
.ro .v { font-family: var(--mono); font-size: .76rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.meter { grid-column: 1 / -1; height: 3px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--series-1); border-radius: 2px; width: 0; transition: width .3s ease; }
.meter i.amber { background: var(--series-2); }

.scope-foot { padding: .6rem .85rem; border-top: 1px solid var(--rule-soft); font-size: .78rem; color: var(--ink-3); background: var(--panel-2); }
.scope-foot b { color: var(--ink-2); font-weight: 600; }

/* ============================================================
   SECTIONS
   ============================================================ */
section { padding: clamp(3rem, 7vw, 5.5rem) 0; }
.sec-head { margin-bottom: 2.2rem; }
.sec-head h2 { font-size: var(--step-2); letter-spacing: -.025em; margin: .5rem 0 .7rem; }

.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); }
.pr { padding: 1.4rem 1.3rem; border-inline-end: 1px solid var(--rule-soft); }
.pr:last-child { border-inline-end: 0; }
.pr h3 { font-family: var(--display); font-size: .9rem; letter-spacing: .02em; margin-bottom: .5rem; }
.pr p { margin: 0; font-size: .87rem; color: var(--ink-2); line-height: 1.55; }
@media (max-width: 780px) { .pr { border-inline-end: 0; border-bottom: 1px solid var(--rule-soft); } .pr:last-child { border-bottom: 0; } }

.rows { border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); }
.row {
  display: grid; grid-template-columns: 12px 190px 1fr 92px; gap: 1rem; align-items: center;
  width: 100%; text-align: start; padding: .85rem 1rem; background: transparent; border: 0;
  border-bottom: 1px solid var(--rule-soft); cursor: pointer; color: inherit; font: inherit;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel-2); }
.row .nm { font-family: var(--mono); font-size: .86rem; color: var(--ink); letter-spacing: -.01em; }
.row .ds { font-size: .85rem; color: var(--ink-2); line-height: 1.45; }
.row .pf { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; color: var(--ink-3); text-align: end; text-transform: uppercase; }
:root[lang="he"] .row .pf { font-family: var(--sans); letter-spacing: 0; font-size: .72rem; text-transform: none; }
.row .sd { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-line); }
@media (max-width: 820px) {
  .row { grid-template-columns: 12px 1fr; row-gap: .3rem; }
  .row .pf { grid-column: 2; text-align: start; }
}

pre.code {
  margin: 0; padding: .95rem 1.05rem; overflow-x: auto;
  background: var(--panel-2); border: 1px solid var(--rule); border-radius: 4px;
  font-size: .8rem; line-height: 1.65; color: var(--ink); text-align: left;
}
pre.code .c { color: var(--ink-3); }
pre.code .k { color: var(--accent); }
pre.code .s { color: var(--series-2); }

.codehead { display: flex; align-items: center; gap: .6rem; margin-bottom: .55rem; font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="he"] .codehead { font-family: var(--sans); letter-spacing: 0; font-size: .78rem; text-transform: none; }

.detail-top { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: start; }
@media (max-width: 900px) { .detail-top { grid-template-columns: 1fr; } }
.back { font-family: var(--mono); font-size: .76rem; color: var(--ink-3); background: transparent; border: 0; cursor: pointer; padding: 0; margin-bottom: 1.2rem; }
:root[lang="he"] .back { font-family: var(--sans); font-size: .84rem; }
.back:hover { color: var(--accent); }

.kv { border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); }
.kv div { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem .85rem; border-bottom: 1px solid var(--rule-soft); font-family: var(--mono); font-size: .76rem; }
.kv div:last-child { border-bottom: 0; }
.kv dt { color: var(--ink-3); }
:root[lang="he"] .kv dt { font-family: var(--sans); font-size: .82rem; }
.kv dd { margin: 0; color: var(--ink); text-align: end; }

.signals { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.chip { font-family: var(--mono); font-size: .7rem; letter-spacing: .04em; border: 1px solid var(--rule); color: var(--ink-2); padding: .25rem .55rem; border-radius: 3px; background: var(--panel); }

.pad { position: relative; height: 168px; border: 1px dashed var(--accent-line); border-radius: 4px; background: var(--panel-2); display: grid; place-items: center; cursor: pointer; user-select: none; overflow: hidden; }
.pad p { margin: 0; font-family: var(--mono); font-size: .78rem; color: var(--ink-3); text-align: center; padding: 0 1rem; }
:root[lang="he"] .pad p { font-family: var(--sans); font-size: .86rem; }
.ripple { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--series-2); opacity: .55; transform: translate(-50%,-50%); pointer-events: none; }

/* ============================================================
   PREMIUM / DASHBOARD
   ============================================================ */
.badge { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-soft); padding: .25rem .55rem; border-radius: 3px; }
:root[lang="he"] .badge { font-family: var(--sans); letter-spacing: 0; font-size: .76rem; text-transform: none; }

.dash { border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
.dash-bar { display: flex; align-items: center; gap: .7rem; padding: .65rem .9rem; border-bottom: 1px solid var(--rule-soft); background: var(--panel-2); flex-wrap: wrap; }
.dash-bar .app { font-family: var(--mono); font-size: .78rem; color: var(--ink); }
.dash-bar .sep { color: var(--ink-3); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; margin-inline-start: auto; }
.seg button { font-family: var(--mono); font-size: .7rem; background: transparent; border: 0; color: var(--ink-3); padding: .3rem .6rem; cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-bottom: 1px solid var(--rule-soft); }
.tile { padding: .95rem 1rem; border-inline-end: 1px solid var(--rule-soft); }
.tile:last-child { border-inline-end: 0; }
.tile .lab { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="he"] .tile .lab { font-family: var(--sans); letter-spacing: 0; font-size: .78rem; text-transform: none; }
.tile .num { font-family: var(--mono); font-size: 1.55rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: .25rem; }
.tile .delta { font-family: var(--mono); font-size: .72rem; display: flex; align-items: center; gap: .3rem; margin-top: .1rem; }
:root[lang="he"] .tile .delta { font-family: var(--sans); font-size: .78rem; }
.up { color: var(--good); } .down { color: var(--crit); } .flat { color: var(--ink-3); }

.charts { display: grid; grid-template-columns: 1.35fr 1fr; }
@media (max-width: 880px) { .charts { grid-template-columns: 1fr; } }
.chart { padding: 1.1rem 1.1rem 1.2rem; border-inline-end: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.chart:nth-child(even) { border-inline-end: 0; }
.chart h4 { font-size: .9rem; margin-bottom: .15rem; }
.chart .sub { font-size: .76rem; color: var(--ink-3); margin-bottom: .9rem; }
.legend { display: flex; gap: 1rem; margin-bottom: .7rem; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: .38rem; font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }
:root[lang="he"] .legend span { font-family: var(--sans); font-size: .8rem; }
.swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

.chart-wrap { position: relative; overflow-x: auto; }
svg.plot { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 3px; padding: .4rem .55rem; font-family: var(--mono); font-size: .72rem; color: var(--ink); box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.tip.on { opacity: 1; }
.tip .tk { color: var(--ink-3); }

table.data { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .74rem; margin-top: .8rem; }
table.data th, table.data td { text-align: right; padding: .3rem .5rem; border-bottom: 1px solid var(--rule-soft); font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--ink-3); font-weight: 500; }
.toggle-data { font-family: var(--mono); font-size: .7rem; background: transparent; border: 0; color: var(--ink-3); cursor: pointer; padding: .3rem 0; text-decoration: underline; }
:root[lang="he"] .toggle-data { font-family: var(--sans); font-size: .78rem; }
.toggle-data:hover { color: var(--accent); }

.keyrow { display: grid; grid-template-columns: 1fr auto auto; gap: 1rem; align-items: center; padding: .75rem .9rem; border-bottom: 1px solid var(--rule-soft); }
.keyrow:last-child { border-bottom: 0; }
.keyrow .kname { font-family: var(--mono); font-size: .82rem; }
.keyrow .kval { font-family: var(--mono); font-size: .74rem; color: var(--ink-3); }
.keyrow .kmeta { font-family: var(--mono); font-size: .7rem; color: var(--ink-3); }
:root[lang="he"] .keyrow .kmeta { font-family: var(--sans); font-size: .78rem; }
.pill { font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; padding: .18rem .45rem; border-radius: 3px; border: 1px solid; }
:root[lang="he"] .pill { font-family: var(--sans); letter-spacing: 0; font-size: .74rem; text-transform: none; }
.pill.live { color: var(--good); border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.pill.test { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
@media (max-width: 700px) { .keyrow { grid-template-columns: 1fr; row-gap: .3rem; } }

.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); }
.plan { padding: 1.4rem 1.3rem; border-inline-end: 1px solid var(--rule-soft); }
.plan:last-child { border-inline-end: 0; }
.plan.hi { background: var(--panel-2); }

}

.demo-side { display: grid; gap: .9rem; }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function hl(src) {
  return esc(src)
    .replace(/(\/\/[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/(&quot;[^&]*?&quot;)/g, '<span class="s">$1</span>')
    .replace(/\b(val|var|fun|if|else|when|import|return|forEach|let)\b/g, '<span class="k">$1</span>');
}
const codeBlock = (label, src) =>

function reveal(root = document) {
  const els = root.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(en => {
    en.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px", threshold: .08 });
  els.forEach(e => io.observe(e));
}

function lineChart({ w = 560, h = 170, data, labels, colors }) {
  const pad = { l: 34, r: 14, t: 12, b: 24 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(...data.flat()) * 1.12, min = 0;
  const X = i => pad.l + (i / (data[0].length - 1)) * iw;
  const Y = v => pad.t + ih - ((v - min) / (max - min)) * ih;

  const gridY = [0,.25,.5,.75,1].map(k => {
    const y = pad.t + ih - k * ih;
    return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${pad.l-8}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--ink-3)">${Math.round(min+k*(max-min))}</text>`;
  }).join("");

  const paths = data.map((row, si) => {
    const d = row.map((v,i) => `${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const area = data.length === 1
      ? `<path d="${d}L${X(row.length-1)},${pad.t+ih}L${X(0)},${pad.t+ih}Z" fill="${colors[si]}" opacity=".10"/>` : "";
    return `${area}<path d="${d}" fill="none" stroke="${colors[si]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${X(row.length-1)}" cy="${Y(row[row.length-1])}" r="4" fill="${colors[si]}" stroke="var(--panel)" stroke-width="2"/>`;
  }).join("");

  const step = Math.ceil(labels.length / 6);
  const ticks = labels.map((l,i) => (i % step === 0 || i === labels.length-1)
    ? `<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--ink-3)">${esc(l)}</text>` : "").join("");

  const bw = iw / labels.length;
  const hits = labels.map((l,i) =>
    `<rect x="${X(i)-bw/2}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}" data-label="${esc(l)}"/>`).join("");

  return `<svg class="plot" viewBox="0 0 ${w} ${h}" font-family="ui-monospace,Menlo,monospace" role="img" aria-label="chart">
    ${gridY}${paths}${ticks}
    <line class="cross" x1="0" y1="${pad.t}" x2="0" y2="${pad.t+ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    <g class="hits">${hits}</g></svg>`;
}

function barsH(rows) {
  const max = Math.max(...rows.map(r => r.v));
  return `<div style="display:grid;gap:.5rem">` + rows.map(r => `
    <div style="display:grid;grid-template-columns:130px 1fr 46px;gap:.6rem;align-items:center" data-tip="${esc(r.k)} · ${r.v}%">
      <span class="mono ltr" style="font-size:.74rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.k)}</span>
      <span style="height:10px;background:var(--grid);border-radius:5px;overflow:hidden;display:block">
        <i style="display:block;height:100%;width:${(r.v/max*100).toFixed(1)}%;background:var(--series-1);border-radius:5px"></i>
      </span>
      <span class="mono" style="font-size:.74rem;text-align:end;font-variant-numeric:tabular-nums">${r.v}%</span>
    </div>`).join("") + `</div>`;
}

function heat(weeks = 12) {
  const dl = t("days");
  let cells = "";
  for (let d = 0; d < 7; d++) for (let w = 0; w < weeks; w++) {
    const v = Math.max(.04, Math.min(1, (d < 5 ? .55 : .25) + Math.sin((w+d)*1.1)*.22 + (w/weeks)*.2));
    cells += `<rect x="${w*15}" y="${d*15}" width="12" height="12" rx="2" fill="var(--series-1)" fill-opacity="${v.toFixed(2)}"
      data-tip="${dl[d]} · ${t("dash.week")} ${w+1} · ${Math.round(v*100)}% ${t("dash.active")}"/>`;
  }
  const lab = dl.map((d,i) => `<text x="-6" y="${i*15+9.5}" text-anchor="end" font-size="8" fill="var(--ink-3)">${d}</text>`).join("");
  return `<svg class="plot" viewBox="-16 -4 ${weeks*15+20} 112" font-family="ui-monospace,Menlo,monospace" role="img" aria-label="heatmap">${lab}${cells}</svg>`;
}

const setVerdict = (id, name, conf, ev) => {
  const v = document.getElementById(id + "-v"), e = document.getElementById(id + "-e");
  if (!v) return;
  v.innerHTML = `<b>${name}</b><span>${conf == null ? "" : "confidence " + conf.toFixed(2)}</span>`;
  if (e) e.innerHTML = Object.entries(ev || {}).map(([k, val]) =>

  const list = document.getElementById(id + "-s");
  if (!list) return;
  list.querySelectorAll(".sig").forEach(row => {
    const hit = row.dataset.sig === name;
    row.classList.toggle("on", hit);
    if (hit) {
      row.querySelector(".sv").textContent = conf == null ? "fired" : conf.toFixed(2);
      row.querySelector(".sb i").style.width = ((conf == null ? .6 : conf) * 100) + "%";

  });
};

/* small scheduler every demo uses; returns a cleanup fn */
function loop(steps, ms) {
  let i = 0, timer = null, stopped = false;
  const tick = () => {
    if (stopped) return;
    steps[i % steps.length](i);
    i++;
    timer = setTimeout(tick, ms);
  };
  tick();
  return () => { stopped = true; clearTimeout(timer); };
}

        prevLen = len;
        clearTimeout(typeT);
        typeT = setTimeout(() => { deletes = 0; retypes = 0; }, 8000);
        if (deletes >= 3 && retypes >= 2)
          fire("TYPE_DELETE_LOOP", Math.min(.95, .5 + deletes * .07),
            { field: "card_number", deletes, retypes, chars: len });
        else
          fire("TYPING", null, { field: "card_number", chars: len, deletes });
      });

      /* SCAN_SCROLL */
      let lastTop = 0, lastTs = 0;
      on(scr, "scroll", () => {
        const now = performance.now();
        const v = Math.abs(scr.scrollTop - lastTop) / Math.max(16, now - lastTs) * 1000;
        lastTop = scr.scrollTop; lastTs = now;
        if (v > 380) fire("SCAN_SCROLL", Math.min(.93, v / 900),
          { px_per_s: Math.round(v), dwell_ms: 0 });
      }, { passive: true });

      /* DOUBLE_BACK */
      let backs = [];
      on(back, "click", () => {
        const now = performance.now();
        backs = backs.filter(t => now - t < 800); backs.push(now);
        if (backs.length >= 2) fire("DOUBLE_BACK", .86, { presses: backs.length, window_ms: 800, screen: "checkout" });
        else fire("BACK", null, { presses: 1 });
      });

      /* ZIGZAG_NAV */
      let switches = [];
      on(root, "click", e => {
        const b = e.target.closest("[data-tab]"); if (!b) return;
        tabs.forEach(x => x.classList.toggle("on", x === b));
        const now = performance.now();
        switches = switches.filter(t => now - t < 5000); switches.push(now);
        if (switches.length >= 4) fire("ZIGZAG_NAV", Math.min(.92, .45 + switches.length * .09),
          { switches: switches.length, window_s: 5, between: "card ↔ paypal" });
        else fire("NAV", null, { switches: switches.length });
      });

      /* FAILED_DRAG — picked up, moved, released outside the target */
      let dragging = false, moved = 0, sx = 0, sy = 0;
      on(chip, "pointerdown", e => {
        dragging = true; moved = 0; sx = e.clientX; sy = e.clientY;
        chip.setPointerCapture(e.pointerId);
      });
      on(chip, "pointermove", e => {
        if (!dragging) return;
        moved = Math.hypot(e.clientX - sx, e.clientY - sy);
        const r = drop.getBoundingClientRect();
        const over = e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
        drop.classList.toggle("hot", over);
        chip.style.transform = `translate(${e.clientX - sx}px, ${e.clientY - sy}px)`;
      });
      on(chip, "pointerup", e => {
        if (!dragging) return;
        dragging = false;
        const r = drop.getBoundingClientRect();
        const dropped = e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
        chip.style.transform = "";
        drop.classList.remove("hot");
        if (moved > 18 && !dropped)
          fire("FAILED_DRAG", .79, { travel_px: Math.round(moved), released_over: "nothing", target: "save_zone" });
        else if (dropped)
          fire("DRAG_OK", null, { travel_px: Math.round(moved), target: "save_zone" });
      });

      return () => { cleanups.forEach(f => f()); clearTimeout(idleT); clearTimeout(typeT); };
    }

/* mount every [data-demo] in a subtree; returns a combined cleanup */
function mountDemos(root) {
  const demos = buildDemos();
  const stops = [];
  root.querySelectorAll("[data-demo]").forEach(host => {
    const demo = demos[host.dataset.demo];
    if (!demo) { host.remove(); return; }
    const box = document.createElement("div");
    box.innerHTML = demo.html;
    host.appendChild(box);
    try {
      const stop = demo.init(box);
      if (typeof stop === "function") stops.push(stop);
    } catch (err) { console.warn("demo failed:", host.dataset.demo, err); }
  });
  return () => stops.forEach(s => { try { s(); } catch {} });
}

let traceStop = null;
let demoStop = null;
function startTrace() {
  const cv = $("#trace"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const pick = n => css.getPropertyValue(n).trim() || "#888";

  const N = 150, buf = new Array(N).fill(0);
  let vel = 0, lastX = 0, lastY = 0, lastMove = performance.now();
  let clicks = [], rage = 0, hes = 0, scan = 0, fr = 0, raf = null;
  const t0 = performance.now();

  const onMove = e => {
    const d = Math.min(60, Math.hypot(e.clientX-lastX, e.clientY-lastY));
    lastX = e.clientX; lastY = e.clientY;
    vel = vel*.7 + d*.3; lastMove = performance.now();
  };
  const onDown = e => {
    const now = performance.now();
    clicks = clicks.filter(c => now-c.t < 900);
    clicks.push({t:now, x:e.clientX, y:e.clientY});
    if (clicks.length >= 3) {
      const sp = Math.max(...clicks.map(c => Math.hypot(c.x-clicks[0].x, c.y-clicks[0].y)));
      if (sp < 90) rage = Math.min(1, rage+.34);
    }
    vel = 55;
  };
  addEventListener("pointermove", onMove, {passive:true});
  addEventListener("pointerdown", onDown, {passive:true});

  const setRO = (k, v, hit) => {
    const el = $("#v-"+k), m = $("#m-"+k);
    if (el) el.textContent = v.toFixed(2);
    if (m) m.style.width = (v*100).toFixed(0)+"%";
    const row = document.querySelector(`.ro[data-ro="${k}"]`);
    if (row) row.classList.toggle("hit", !!hit);
  };

  function frame() {
    const now = performance.now(), idle = (now-lastMove)/1000;
    hes  = idle > 1.4 ? Math.min(1,(idle-1.4)/2.6) : Math.max(0, hes-.04);
    scan = Math.min(1, vel/34);
    rage = Math.max(0, rage-.012);
    fr   = Math.min(1, rage*.58 + hes*.26 + scan*.18);

    buf.push(vel); if (buf.length > N) buf.shift();
    vel *= .90;

    const w = cv.width, h = cv.height;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = pick("--grid"); ctx.lineWidth = 1;
    for (let i=1;i<4;i++){ const y=(h/4)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

    ctx.beginPath();
    buf.forEach((v,i) => {
      const x = (i/(N-1))*w, y = h-6-Math.min(h-12,(v/60)*(h-16));
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.strokeStyle = pick("--series-1"); ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();

    if (rage > .25) {
      ctx.fillStyle = pick("--series-2"); ctx.globalAlpha = Math.min(.9, rage);
      ctx.fillRect(w-4,0,4,h); ctx.globalAlpha = 1;
    }

    setRO("rage",rage,rage>.5); setRO("hes",hes,hes>.5);
    setRO("scan",scan,scan>.6); setRO("fr",fr,fr>.5);

    const el = Math.floor((now-t0)/1000), clk = $("#scopeclock");
    if (clk) clk.textContent = `${String(Math.floor(el/60)).padStart(2,"0")}:${String(el%60).padStart(2,"0")}`;
    raf = requestAnimationFrame(frame);
  }

  if (reduce) {
    ctx.strokeStyle = pick("--series-1"); ctx.lineWidth = 2; ctx.beginPath();
    for (let i=0;i<N;i++){ const x=(i/(N-1))*cv.width, y=cv.height/2+Math.sin(i/9)*18; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    setRO("rage",.12); setRO("hes",.30); setRO("scan",.21); setRO("fr",.19);
  } else frame();

  traceStop = () => {
    if (raf) cancelAnimationFrame(raf);
    removeEventListener("pointermove", onMove);
    removeEventListener("pointerdown", onDown);
  };
}

function wirePad() {
  const pad = $("#pad"); if (!pad) return;
  const txt = $("#padtext");
  let taps = [], idleT;
  pad.addEventListener("pointerdown", e => {
    const r = pad.getBoundingClientRect();
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.left = (e.clientX-r.left)+"px"; dot.style.top = (e.clientY-r.top)+"px";
    pad.appendChild(dot); setTimeout(()=>dot.remove(), 700);

    const now = performance.now();
    taps = taps.filter(x => now-x < 900); taps.push(now);
    if (taps.length >= 3) {
      txt.textContent = `RAGE_TAP  ${Math.min(.97,.4+taps.length*.12).toFixed(2)}`;
      txt.style.color = "var(--series-2)";
    } else {
      txt.textContent = `${taps.length} ${t("d.taps")}`;
      txt.style.color = "var(--ink-3)";
    }
  });
  pad.addEventListener("pointerup", () => {
    clearTimeout(idleT);
    idleT = setTimeout(() => { txt.textContent = "HESITATION  0.61"; txt.style.color = "var(--accent)"; }, 1800);
  });
}

/* ============================================================
   CHART INTERACTION
   ============================================================ */
function wireCharts(root) {
  root.querySelectorAll(".chart-wrap").forEach(wrap => {
    const tip = wrap.querySelector(".tip"); if (!tip) return;
    const svg = wrap.querySelector("svg"), cross = wrap.querySelector(".cross");

    const show = (html, x, y) => {
      tip.innerHTML = html; tip.classList.add("on");
      const wr = wrap.getBoundingClientRect();
      tip.style.left = Math.min(wr.width-tip.offsetWidth-6, Math.max(4, x-tip.offsetWidth/2))+"px";
      tip.style.top  = Math.max(2, y-tip.offsetHeight-10)+"px";
    };
    const hide = () => { tip.classList.remove("on"); if (cross) cross.setAttribute("opacity","0"); };

    wrap.querySelectorAll(".hits rect").forEach(r => {
      r.addEventListener("pointerenter", () => {
        const i = +r.dataset.i;
        const sr = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
        const vx = +r.getAttribute("x") + (+r.getAttribute("width"))/2;
        if (cross) { cross.setAttribute("x1",vx); cross.setAttribute("x2",vx); cross.setAttribute("opacity",".55"); }
        const cx = sr.left - wr.left + vx * (sr.width / svg.viewBox.baseVal.width);
        const body = wrap.dataset.chart === "cmp"
          ? `<span class="tk">${t("dash.rage")}</span> ${D_RAGE[i]}<br><span class="tk">${t("dash.hes")}</span> ${D_HES[i]}`
          : `<span class="tk">${t("dash.score")}</span> ${D_FR[i]}`;
        show(`<b>${t("dash.day")} ${r.dataset.label}</b><br>${body}`, cx, 40);
      });
    });
    wrap.addEventListener("pointerleave", hide);

    wrap.querySelectorAll("[data-tip]").forEach(el => {
      el.addEventListener("pointerenter", e => {
        const wr = wrap.getBoundingClientRect();
        show(el.dataset.tip, e.clientX-wr.left, e.clientY-wr.top);
      });
    });
  });

  root.querySelectorAll("[data-tip]").forEach(el => { if (!el.closest(".chart-wrap")) el.title = el.dataset.tip; });

  root.querySelectorAll(".toggle-data").forEach(b => {
    b.addEventListener("click", () => {
      const tb = root.querySelector("#tbl-"+b.dataset.table); if (!tb) return;
      tb.hidden = !tb.hidden;
      b.textContent = tb.hidden ? t("dash.show") : t("dash.hide");
    });
  });
}

/* ============================================================
   ROUTER + LANGUAGE
   ============================================================ */
function applyChrome() {
  const html = document.documentElement;
  html.setAttribute("lang", LANG);
  html.setAttribute("dir", t("dir"));
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#langbtn").textContent = t("nav.lang");
  $("#ghlink").textContent  = t("nav.github");
  $("#ft-tag").textContent  = t("ft.tag");
}

function render() {
  if (traceStop) { traceStop(); traceStop = null; }
  if (demoStop)  { demoStop();  demoStop = null; }
  const hash = location.hash.replace(/^#/,"") || "/";
  const app = $("#app");
  let nav = "";

  if (hash.startsWith("/sdk/")) {
    const id = hash.slice(5);
    app.innerHTML = detailView(id);
    const s = SDKS.find(x => x.id === id);
    nav = s && s.plat === "ios" ? "ios" : (s && s.plat === "both" ? "" : "android");
    wirePad();
  } else if (hash === "/android") { app.innerHTML = catalogView("android"); nav = "android"; }
  else if (hash === "/ios")       { app.innerHTML = catalogView("ios");     nav = "ios"; }
  else if (hash === "/premium")   { app.innerHTML = premiumView();          nav = "premium"; }
  else if (hash === "/about")     { app.innerHTML = aboutView();            nav = "about"; }
  else { app.innerHTML = heroView(); startTrace(); wireInstall(); }

  document.querySelectorAll(".navlinks a").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));

  demoStop = mountDemos(app);
  wireCharts(app);
  reveal(app);

  app.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => location.hash = "#/sdk/"+b.dataset.goto));
  app.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => history.back()));

  const wl = $("#wl");
  if (wl) wl.addEventListener("submit", e => { e.preventDefault(); $("#wlmsg").hidden = false; wl.reset(); });

  window.scrollTo({ top: 0, behavior: "auto" });
}

function wireInstall() {
  const snippets = {
    gradle: 'implementation("io.github.rongo270:intent-engine:0.2.0")',
    spm: '.package(url: "https://github.com/rongo270/rgkit.git", from: "0.2.0")'
  };
  document.querySelectorAll("[data-inst]").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-inst]").forEach(x => {
        x.classList.toggle("on", x === b);
        x.setAttribute("aria-selected", x === b ? "true" : "false");
      });
      $("#instcode").textContent = snippets[b.dataset.inst];
    });
  });
  const cb = $("#copybtn");
  if (cb) cb.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#instcode").textContent); cb.textContent = "✓"; }
    catch { cb.textContent = "⌘C"; }
    setTimeout(() => cb.textContent = "copy", 1600);
  });
}

$("#langbtn").addEventListener("click", () => {
  LANG = LANG === "en" ? "he" : "en";
  localStorage.setItem("rgkit.lang", LANG);
  applyChrome();
  render();
});
$("#ghlink").addEventListener("click", () => window.open(REPO, "_blank", "noopener"));
addEventListener("hashchange", render);

applyChrome();
render();
</script>
</body>
